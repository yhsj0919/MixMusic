name: mix_music
description: "MixMusic v2"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.2.2
  collection: ^1.19.1
  crypto: ^3.0.7
  mime: ^2.1.0
  lemon_ui:
    path: ../lemon_ui
  lemon_x:
    path: ../lemon_x
  lemon_net:
    path: ../lemon_net
  lemon_js:
    path: ../quickjs/packages/lemon_js
  lemon_js_ui:
    path: ../quickjs/packages/lemon_js_ui
  lemon_js_ui_webview:
    path: ../quickjs/packages/lemon_js_ui_webview
  lemon_js_extensions:
    path: ../quickjs/packages/lemon_js_extensions
  lemon_lyric:
    path: ../lemon_lyric
  mpv_audio_kit: ^0.4.8
  lemon_audio:
    path: ../lemon_audio
  file_picker: ^13.1.0
  android_file_picker: ^2.0.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqlite_async: ^0.14.6
  package_info_plus: ^10.2.1
  pub_semver: ^2.2.1
  url_launcher: ^6.3.2

dependency_overrides:
  lemon_js:
    path: ../quickjs/packages/lemon_js
  lemon_js_ui:
    path: ../quickjs/packages/lemon_js_ui

dev_dependencies:
  fake_async: ^1.3.3
